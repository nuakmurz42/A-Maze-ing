[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable recursive-backtracker maze generator for A-Maze-ing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [{name = "nurya"}]

[project.scripts]
a-maze-ing = "a_maze_ing:main"

[tool.setuptools]
packages = ["mazegen", "display", "parsing"]
py-modules = ["a_maze_ing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true
